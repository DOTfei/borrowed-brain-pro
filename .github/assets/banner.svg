<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Borrowed Brain Pro Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#0e121a"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Glow Orbs -->
    <radialGradient id="blue-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#blue-glow)"/>
  <rect width="1200" height="420" fill="url(#purple-glow)"/>
  <rect width="1200" height="420" rx="16" fill="none" stroke="#30363d" stroke-width="1.5" opacity="0.6"/>

  <!-- Decorative Grid Lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="640" y1="60" x2="640" y2="360"/>
  </g>

  <!-- LEFT COLUMN: Value Proposition & Branding -->
  <!-- Kicker Badge -->
  <rect x="60" y="85" width="210" height="28" rx="14" fill="rgba(88, 166, 255, 0.1)" stroke="rgba(88, 166, 255, 0.3)" stroke-width="1"/>
  <text x="75" y="104" font-family="'Geist Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#58a6ff" letter-spacing="1.5">OPEN SOURCE SKILL v0.3</text>

  <!-- Main Title -->
  <text x="60" y="160" font-family="'Geist', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Borrowed Brain Pro</text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="200" font-family="'Geist', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#8b949e">Consult the World's Greatest Minds in 1 Click.</text>

  <!-- Feature Description -->
  <text x="60" y="235" font-family="'Geist', -apple-system, sans-serif" font-size="14" fill="#6e7681">Distilled decision frameworks applied to your real dilemmas.</text>
  <text x="60" y="256" font-family="'Geist', -apple-system, sans-serif" font-size="14" fill="#6e7681">Jobs · Buffett · Munger · Socrates · Laozi &amp; 13 more.</text>

  <!-- Platform Badges -->
  <g transform="translate(60, 290)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="18" font-family="'Geist Mono', monospace" font-size="11" fill="#c9d1d9">Claude.ai</text>

    <!-- Badge 2 -->
    <rect x="110" y="0" width="120" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="124" y="18" font-family="'Geist Mono', monospace" font-size="11" fill="#c9d1d9">Cursor / Windsurf</text>

    <!-- Badge 3 -->
    <rect x="240" y="0" width="90" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="254" y="18" font-family="'Geist Mono', monospace" font-size="11" fill="#c9d1d9">ChatGPT</text>

    <!-- Badge 4 -->
    <rect x="340" y="0" width="85" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="354" y="18" font-family="'Geist Mono', monospace" font-size="11" fill="#c9d1d9">Ollama</text>
  </g>

  <!-- RIGHT COLUMN: Visual Diagram / Engine Flow -->
  <g transform="translate(670, 85)">
    <!-- Card Container -->
    <rect x="0" y="0" width="470" height="245" rx="12" fill="url(#card-bg)" stroke="#30363d" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="470" height="36" rx="12" fill="#21262d" opacity="0.5"/>
    <circle cx="20" cy="18" r="5" fill="#f85149"/>
    <circle cx="36" cy="18" r="5" fill="#e3b341"/>
    <circle cx="52" cy="18" r="5" fill="#3fb950"/>
    <text x="72" y="22" font-family="'Geist Mono', monospace" font-size="11" fill="#8b949e">how-it-works.md</text>

    <!-- Node 1: Dilemma Input -->
    <rect x="25" y="60" width="130" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="78" font-family="'Geist Mono', monospace" font-size="10" fill="#58a6ff">[01] YOUR DILEMMA</text>
    <text x="40" y="94" font-family="'Geist', sans-serif" font-size="11" fill="#8b949e">Pricing / Strategy</text>

    <!-- Arrow 1 -->
    <path d="M 155 82 L 185 82" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="185,79 192,82 185,85" fill="#58a6ff"/>

    <!-- Node 2: Distill Engine -->
    <rect x="192" y="60" width="250" height="44" rx="8" fill="#0d1117" stroke="rgba(88, 166, 255, 0.4)" stroke-width="1"/>
    <text x="207" y="78" font-family="'Geist Mono', monospace" font-size="10" fill="#3fb950">[02] DISTILL ENGINE</text>
    <text x="207" y="94" font-family="'Geist', sans-serif" font-size="11" fill="#c9d1d9">Primary Sources + Failure Audits</text>

    <!-- Arrow Down -->
    <path d="M 317 104 L 317 124" stroke="#a371f7" stroke-width="1.5"/>
    <polygon points="314,124 317,131 320,124" fill="#a371f7"/>

    <!-- Node 3: Virtual Boardroom Debate -->
    <rect x="25" y="131" width="417" height="85" rx="8" fill="#0d1117" stroke="rgba(163, 113, 247, 0.4)" stroke-width="1"/>
    <text x="40" y="152" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#a371f7">[03] VIRTUAL BOARDROOM DEBATE</text>
    
    <text x="40" y="173" font-family="'Geist', sans-serif" font-size="11" fill="#e6edf3">Jobs: <tspan fill="#8b949e">"Never compete on price."</tspan></text>
    <text x="40" y="190" font-family="'Geist', sans-serif" font-size="11" fill="#e6edf3">Munger: <tspan fill="#8b949e">"Invert the problem — improve value first."</tspan></text>

    <rect x="330" y="172" width="95" height="24" rx="12" fill="rgba(63, 185, 80, 0.15)" stroke="rgba(63, 185, 80, 0.3)" stroke-width="1"/>
    <text x="343" y="188" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#3fb950">CONSENSUS</text>
  </g>
</svg>