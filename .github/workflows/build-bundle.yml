name: Build & Verify Bundle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Bundle
        run: python scripts/build_bundle.py

      - name: Check for Uncommitted Bundle Changes
        run: |
          git diff --exit-code borrowed-brain-bundle.md claude-ai-bundle.md || (echo "Error: generated bundles are out of sync. Run 'python scripts/build_bundle.py' and commit both files." && exit 1)
