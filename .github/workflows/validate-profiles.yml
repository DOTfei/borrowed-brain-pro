name: Validate Profiles Schema & Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Automated Profile Rating & Quality Validator
        run: |
          python scripts/validate_profiles.py
      - name: Rebuild profile manifest
        run: |
          python scripts/build_profile_manifest.py
          git diff --exit-code profiles/manifest.json
